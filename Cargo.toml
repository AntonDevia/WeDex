[package]
name = "wedex"
version = "0.8.5"
edition = "2021"
description = "Sonora — a native music client with Last.fm discovery"
license = "MIT"

[workspace]
members = ["crates/wedex-cloud", "crates/wedex-provision", "crates/wedex-update"]
resolver = "2"

[[bin]]
name = "sonora"
path = "src/main.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
wedex-cloud = { path = "crates/wedex-cloud" }
wedex-update = { path = "crates/wedex-update" }
anyhow = "1"
base64 = "0.22"
byteorder = "1.5"
chfft = "0.3.4"
cpal = "0.15.3"
crc32fast = "1.4"
directories = "6"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "__screenshot"] }
egui_extras = { version = "0.31.1", features = ["http", "image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
md5 = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
rodio = { version = "0.20.1", default-features = false, features = ["symphonia-all"] }
roxmltree = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
webbrowser = "1"

[target.'cfg(windows)'.dependencies]
wedex-provision = { path = "crates/wedex-provision" }
zeroize = "1"
keyring = { version = "3", features = ["windows-native"] }
tray-icon = { version = "0.26.1", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "android-game-activity"] }
winit = { version = "0.30", default-features = false, features = ["android-game-activity"] }
android_logger = "0.15"
jni = "0.21"
log = "0.4"

[dev-dependencies]
winit = { version = "0.30", default-features = false }

[profile.release]
lto = "thin"
strip = true

