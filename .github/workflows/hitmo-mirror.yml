name: Discover Hitmo mirror
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths: ['deploy/hitmo-resolver/**', 'tools/*hitmo*', '.github/workflows/hitmo-mirror.yml']
permissions:
  contents: write
concurrency:
  group: hitmo-mirror
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      HITMO_RESOLVER_URL: ${{ vars.HITMO_RESOLVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - run: php -l deploy/hitmo-resolver/resolver.php && php deploy/hitmo-resolver/test.php
      - run: node --test deploy/hitmo-resolver/test-google.cjs
      - run: python3 -m unittest discover -s tools -p test_hitmo_service.py
      - name: Read last verified address
        run: |
          mkdir -p .local/mirror
          if gh api "repos/$GITHUB_REPOSITORY/contents/mirror.json?ref=hitmo-mirror" > .local/mirror/previous-api.json; then
            python3 - <<'PY'
          import base64,json,pathlib
          p=pathlib.Path('.local/mirror')
          v=json.loads((p/'previous-api.json').read_text())
          (p/'previous.json').write_bytes(base64.b64decode(v['content']))
          PY
          else
            cp deploy/hitmo-resolver/seed.json .local/mirror/previous.json
          fi
      - name: Discover and validate catalogue
        id: resolve
        shell: bash
        run: |
          if python3 tools/read_hitmo_service.py "$HITMO_RESOLVER_URL" .local/mirror/result.json --previous .local/mirror/previous.json --verify-ru; then
            echo 'verified=true' >> "$GITHUB_OUTPUT"
          else
            echo 'verified=false' >> "$GITHUB_OUTPUT"
            echo '::warning::No mirror passed Russian availability checks. The last verified record is unchanged.'
          fi
          if [ -f .local/mirror/result.json ]; then cat .local/mirror/result.json; fi
      - name: Publish only a verified address
        if: steps.resolve.outputs.verified == 'true'
        run: python3 tools/publish_hitmo_mirror.py
