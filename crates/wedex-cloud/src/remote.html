<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Icons: Font Awesome Free 7.3.1, CC BY 4.0, Fonticons. Font: Medeo, OFL 1.1. -->
<title>WeDex · Пульт</title>
<style>
@font-face{font-family:Medeo;src:url(/medeo.ttf) format("truetype");font-display:swap}:root{color-scheme:dark;font-family:Medeo,system-ui,sans-serif;color:#f4f1f8;background:#151319}*{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:24px;display:grid;place-items:center;background:radial-gradient(ellipse at 10% 15%,#49324b88,transparent 65%),radial-gradient(ellipse at 95% 90%,#59745155,transparent 65%),#151319}main{width:min(100%,620px);padding:28px;border:1px solid #ffffff22;border-radius:28px;background:#24212bba;backdrop-filter:blur(24px)}h1{font-size:36px;letter-spacing:-2px;margin:0 0 8px}h2{font-size:26px;margin:22px 0 6px}p,.muted{color:#b4aebd;font-size:14px;line-height:1.5}input,select,button{font:inherit;border-radius:14px;border:1px solid #ffffff26;padding:12px;color:inherit;background:#ffffff0a;max-width:100%}input:not([type=range]),select{width:100%;margin:6px 0 12px}button{cursor:pointer;transition:background .2s,transform .2s}button:hover{background:#ffffff20}button:active{transform:scale(.95)}button:disabled{opacity:.35;cursor:default}.controls{display:flex;justify-content:center;align-items:center;gap:14px;margin:24px 0}.controls button{width:52px;height:52px;display:grid;place-items:center;border-radius:50%;padding:15px}.controls #play{width:68px;height:68px;padding:21px;color:#211f24;background:#e8ffa3;border:0}.controls svg{width:100%;height:100%;fill:currentColor}input[type=range]{accent-color:#e8ffa3;width:100%;padding:0;margin:8px 0}label{display:block;color:#b4aebd;font-size:13px}.times{display:flex;justify-content:space-between;color:#b4aebd;font-size:12px}.options{display:flex;gap:8px;justify-content:center}.active{color:#e8ffa3!important;background:#e8ffa31a!important}.row{padding:12px 0;border-bottom:1px solid #ffffff12;cursor:pointer}.row small{display:block;color:#b4aebd}.row.current{color:#e8ffa3}.badge{font-size:12px;display:inline-block;border-radius:20px;background:#ffffff0a;padding:5px 10px}#notice{min-height:22px}#queue{max-height:240px;overflow:auto}#panel[hidden],#join[hidden]{display:none}footer{margin-top:20px;color:#b4aebd;font-size:12px}
</style>
<main><h1>wedex</h1><span class="badge" id="status">Подключение</span>
<section id="join"><h2>Ваш пульт</h2><p>Откройте новое приглашение из «Моё облако» на компьютере или вставьте одноразовый код. Код действует 10 минут.</p><label>Имя устройства<input id="name" maxlength="60" value="Телефон"></label><label>Код приглашения<input id="code" autocomplete="off" type="password"></label><button id="connect">Подключиться</button></section>
<section id="panel" hidden><label style="margin-top:22px">Где играет музыка<select id="devices"></select></label><h2 id="title">Выберите трек в WeDex</h2><div id="artist" class="muted"></div>
<div class="controls"><button id="previous" aria-label="Предыдущий трек"><svg viewBox="0 0 384 512"><path d="M363 36.8c-12.9-7-28.7-6.3-41 1.8L64 208.1 64 64c0-17.7-14.3-32-32-32S0 46.3 0 64L0 448c0 17.7 14.3 32 32 32s32-14.3 32-32l0-144.1 258 169.6c12.3 8.1 28 8.8 41 1.8s21-20.5 21-35.2l0-368c0-14.7-8.1-28.2-21-35.2z"/></svg></button><button id="play" aria-label="Воспроизвести"><svg viewBox="0 0 384 512"><path id="playpath" d="M91.2 36.9c-12.4-6.8-27.4-6.5-39.6 .7S32 57.9 32 72l0 368c0 14.1 7.5 27.2 19.6 34.4s27.2 7.5 39.6 .7l336-184c12.8-7 20.8-20.5 20.8-35.1s-8-28.1-20.8-35.1l-336-184z"/></svg></button><button id="next" aria-label="Следующий трек"><svg viewBox="0 0 384 512" style="transform:rotate(180deg)"><path d="M363 36.8c-12.9-7-28.7-6.3-41 1.8L64 208.1 64 64c0-17.7-14.3-32-32-32S0 46.3 0 64L0 448c0 17.7 14.3 32 32 32s32-14.3 32-32l0-144.1 258 169.6c12.3 8.1 28 8.8 41 1.8s21-20.5 21-35.2l0-368c0-14.7-8.1-28.2-21-35.2z"/></svg></button></div>
<input id="seek" type="range" min="0" max="1" step=".1" value="0" aria-label="Позиция воспроизведения"><div class="times"><span id="position">0:00</span><span id="duration">0:00</span></div>
<div class="options" style="margin:18px 0"><button id="shuffle">Перемешать</button><button id="repeat">Повтор</button></div><label>Громкость<input id="volume" type="range" min="0" max="1" step=".01" value=".65"></label>
<h3>Очередь</h3><div id="queue"></div><h3>Статистика</h3><p id="stats">Пока нет прослушиваний</p><button id="forget">Отключить этот браузер</button></section>
<p id="notice"></p><footer>Локальный прототип · Музыка играет на выбранном устройстве</footer></main>
<script>
const $=id=>document.getElementById(id),storeKey='wedex-cloud-device-v1';let ws,retryTimer,credential,devices=[],target='',playingState=null,snapshotAt=0,dragging=false,heartbeat;
const playPath='M91.2 36.9c-12.4-6.8-27.4-6.5-39.6 .7S32 57.9 32 72l0 368c0 14.1 7.5 27.2 19.6 34.4s27.2 7.5 39.6 .7l336-184c12.8-7 20.8-20.5 20.8-35.1s-8-28.1-20.8-35.1l-336-184z',pausePath='M48 32C21.5 32 0 53.5 0 80L0 432c0 26.5 21.5 48 48 48l64 0c26.5 0 48-21.5 48-48l0-352c0-26.5-21.5-48-48-48L48 32zm224 0c-26.5 0-48 21.5-48 48l0 352c0 26.5 21.5 48 48 48l64 0c26.5 0 48-21.5 48-48l0-352c0-26.5-21.5-48-48-48l-64 0z';
function notice(s){$('notice').textContent=s}function time(v){v=Math.max(0,Math.floor(v||0));return Math.floor(v/60)+':'+String(v%60).padStart(2,'0')}
function send(m){if(ws?.readyState===1)ws.send(JSON.stringify(m))}function id(){return globalThis.crypto?.randomUUID?.()||'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16))}
function command(action){if(!target||!devices.some(d=>d.id===target&&d.online))return;send({type:'command',command:{id:id(),target,action}})}
function openSocket(){clearTimeout(retryTimer);clearInterval(heartbeat);if(ws){const old=ws;ws=null;old.close()}const current=new WebSocket(location.origin.replace(/^https:/,'wss:')+'/ws');ws=current;$('status').textContent='Подключение';ws.onopen=()=>{if(ws!==current)return;send({type:'authenticate',token:credential.token});heartbeat=setInterval(()=>send({type:'ping'}),10000)};ws.onmessage=e=>{if(ws!==current)return;const m=JSON.parse(e.data);if(m.type==='welcome'){$('status').textContent='На связи';$('join').hidden=true;$('panel').hidden=false;notice('')}if(m.type==='snapshot')render(m);if(m.type==='command_status'&&m.status==='offline')notice('Устройство недоступно');if(m.type==='command_status'&&m.status==='rejected')notice('Команда не выполнена');if(m.type==='error')notice(m.message)};ws.onclose=()=>{if(ws!==current)return;clearInterval(heartbeat);$('status').textContent='Нет соединения';retryTimer=setTimeout(()=>{if(credential)openSocket()},3000)};ws.onerror=()=>current.close()}
function render(m){devices=m.devices.filter(d=>d.can_play);if(!devices.some(d=>d.id===target))target=devices.find(d=>d.online)?.id||devices[0]?.id||'';const select=$('devices');select.replaceChildren();for(const d of devices){const o=document.createElement('option');o.value=d.id;o.textContent=d.name+(d.online?'':' · не в сети');select.append(o)}select.value=target;const d=devices.find(d=>d.id===target);playingState=d?.playback||null;snapshotAt=performance.now();$('title').textContent=playingState?.track?.title||'Выберите трек в WeDex';$('artist').textContent=playingState?.track?.artist||'';$('playpath').setAttribute('d',playingState?.playing?pausePath:playPath);$('playpath').parentElement.setAttribute('viewBox',playingState?.playing?'0 0 384 512':'0 0 448 512');for(const n of ['previous','play','next','seek','volume','shuffle','repeat'])$(n).disabled=!d?.online;$('shuffle').classList.toggle('active',!!playingState?.shuffle);$('repeat').classList.toggle('active',!!playingState?.repeat);if(document.activeElement!==$('volume'))$('volume').value=playingState?.volume??.65;$('seek').max=playingState?.duration||1;$('duration').textContent=time(playingState?.duration);const queue=$('queue');queue.replaceChildren();(playingState?.queue||[]).forEach((t,index)=>{const row=document.createElement('div');row.className='row'+(index===playingState.cursor?' current':'');row.textContent=t.title;const artist=document.createElement('small');artist.textContent=t.artist;row.append(artist);row.onclick=()=>command({type:'queue_index',index});queue.append(row)});const s=m.statistics;$('stats').textContent=Math.floor(s.listened_ms/60000)+' мин · '+s.sessions+' сессий на устройствах';if(s.top_tracks?.length){const best=s.top_tracks[0];$('stats').textContent+=' · Чаще всего: '+best.artist+' — '+best.title}}
$('devices').onchange=()=>{target=$('devices').value;playingState=null};$('previous').onclick=()=>command({type:'previous'});$('next').onclick=()=>command({type:'next'});$('play').onclick=()=>command({type:'set_playing',playing:!playingState?.playing});$('seek').oninput=()=>dragging=true;$('seek').onchange=()=>{command({type:'seek',seconds:Number($('seek').value)});dragging=false};$('volume').onchange=()=>command({type:'volume',value:Number($('volume').value)});$('shuffle').onclick=()=>command({type:'shuffle',enabled:!playingState?.shuffle});$('repeat').onclick=()=>command({type:'repeat',enabled:!playingState?.repeat});
$('connect').onclick=async()=>{notice('Подключаем устройство…');try{const r=await fetch('/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('code').value.trim(),name:$('name').value.trim(),can_play:false})});if(!r.ok)throw Error('Приглашение истекло или уже использовано');credential=await r.json();sessionStorage.setItem(storeKey,JSON.stringify(credential));$('code').value='';openSocket()}catch(e){notice(e.message)}};
$('forget').onclick=()=>{credential=null;sessionStorage.removeItem(storeKey);ws?.close();$('panel').hidden=true;$('join').hidden=false;notice('Для повторного подключения создайте новое приглашение на ПК')};
setInterval(()=>{if(!dragging&&playingState){const v=Math.min(playingState.duration,playingState.position+(playingState.playing&&!playingState.loading?(performance.now()-snapshotAt)/1000:0));$('seek').value=v;$('position').textContent=time(v)}},100);
const initial=new URLSearchParams(location.hash.slice(1)).get('pair');if(initial){$('code').value=initial;history.replaceState(null,'',location.pathname)}try{credential=JSON.parse(sessionStorage.getItem(storeKey))}catch{}if(credential)openSocket();else $('status').textContent='Ожидает привязки';
</script></html>
